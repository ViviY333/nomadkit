<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <style>
    html, body, canvas {
      width: 100%;
      height: 100%;
      margin: 0;
      display: block;
      overflow: hidden;
      background: transparent;
      touch-action: none;
    }
    body { position: relative; }
    body::before {
      content: "";
      position: absolute;
      z-index: 1;
      inset: 4.5%;
      border-radius: 50%;
      pointer-events: none;
      background: radial-gradient(circle at 35% 28%, rgba(226, 243, 255, 0.30), rgba(157, 216, 246, 0.19) 72%, rgba(122, 190, 235, 0) 100%);
      mix-blend-mode: multiply;
    }
    canvas { position: relative; z-index: 0; }
    .city-pin {
      position: absolute;
      z-index: 2;
      width: 15px;
      height: 15px;
      margin: -7px 0 0 -7px;
      border-radius: 50%;
      background: #319fe2;
      box-shadow: 0 2px 7px rgba(49, 159, 226, 0.34);
      transform: scale(var(--visible, 0));
      transform-origin: center;
      opacity: var(--visible, 0);
      pointer-events: none;
    }
    .city-pin::before {
      content: "";
      position: absolute;
      left: 3px;
      top: 11px;
      width: 0;
      height: 0;
      border-left: 4.5px solid transparent;
      border-right: 4.5px solid transparent;
      border-top: 8px solid #319fe2;
    }
    .city-pin::after {
      content: "";
      position: absolute;
      inset: 4px;
      border-radius: 50%;
      background: #eaf9ff;
    }
    .pin-chiang-mai { position-anchor: --cobe-chiang-mai; left: anchor(center); top: anchor(center); --visible: var(--cobe-visible-chiang-mai, 0); }
    .pin-bangkok { position-anchor: --cobe-bangkok; left: anchor(center); top: anchor(center); --visible: var(--cobe-visible-bangkok, 0); }
    .pin-taipei { position-anchor: --cobe-taipei; left: anchor(center); top: anchor(center); --visible: var(--cobe-visible-taipei, 0); }
    .place-tag {
      position: absolute;
      bottom: anchor(top);
      left: anchor(center);
      z-index: 3;
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: max-content;
      margin-bottom: 9px;
      padding: 6px 9px 6px 7px;
      border: 1px solid rgba(12, 25, 55, 0.12);
      border-radius: 999px;
      color: #0c1937;
      background: rgba(255, 255, 255, 0.96);
      box-shadow: 0 5px 16px rgba(12, 25, 55, 0.13);
      font: 600 10px/1.05 -apple-system, BlinkMacSystemFont, sans-serif;
      letter-spacing: 0;
      transform: translateX(-50%) translateY(calc((1 - var(--visible)) * 6px)) scale(calc(.88 + var(--visible) * .12));
      transform-origin: center bottom;
      opacity: var(--visible);
      filter: blur(calc((1 - var(--visible)) * 5px));
      transition: opacity 180ms ease-out, transform 180ms ease-out, filter 180ms ease-out;
      pointer-events: none;
    }
    body.tags-hidden .place-tag { opacity: 0 !important; pointer-events: none; }
    .place-tag.current {
      border-color: #0c1937;
      color: #fff;
      background: #0c1937;
    }
    .place-copy {
      display: grid;
      gap: 2px;
    }
    .place-meta {
      color: #747d91;
      font-size: 8px;
      font-weight: 500;
    }
    .current .place-meta { color: rgba(255, 255, 255, 0.68); }
    .mini-flag {
      position: relative;
      flex: 0 0 auto;
      width: 18px;
      height: 12px;
      overflow: hidden;
      border-radius: 2px;
      box-shadow: 0 0 0 1px rgba(12, 25, 55, 0.09);
    }
    .flag-thailand .mini-flag {
      background: linear-gradient(
        to bottom,
        #b8323f 0 20%,
        #f5f5f3 20% 34%,
        #293f78 34% 66%,
        #f5f5f3 66% 80%,
        #b8323f 80% 100%
      );
    }
    .flag-taiwan .mini-flag { background: #d33b42; }
    .flag-taiwan .mini-flag::before {
      content: "";
      position: absolute;
      inset: 0 auto auto 0;
      width: 9px;
      height: 6px;
      background: #264987;
    }
    .flag-taiwan .mini-flag::after {
      content: "";
      position: absolute;
      top: 1px;
      left: 3px;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #f7f7f4;
    }
    .tag-chiang-mai {
      position-anchor: --cobe-chiang-mai;
      --visible: var(--cobe-visible-chiang-mai, 0);
      margin-left: -58px;
      margin-bottom: 14px;
    }
    .tag-bangkok {
      position-anchor: --cobe-bangkok;
      --visible: var(--cobe-visible-bangkok, 0);
      margin-left: 46px;
      margin-bottom: -10px;
    }
    .tag-taipei {
      position-anchor: --cobe-taipei;
      --visible: var(--cobe-visible-taipei, 0);
      margin-left: 52px;
    }
  </style>
